name: arc-brain-community

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcbrain}
      POSTGRES_USER: ${POSTGRES_USER:-arcbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - arc_postgres_data:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcbrain} -d ${POSTGRES_DB:-arcbrain}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - arc_redis_data:/data

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-arcbrain}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-arcbrain}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Toronto}
      TZ: ${GENERIC_TIMEZONE:-America/Toronto}
    volumes:
      - arc_n8n_data:/home/node/.n8n
      - ../runtime/workflows:/imports:ro

volumes:
  arc_postgres_data:
  arc_redis_data:
  arc_n8n_data:
