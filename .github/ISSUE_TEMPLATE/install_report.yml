name: First-install report
description: Tell us what happened when you installed Arc Brain without prior project knowledge.
title: "[Install]: "
labels: ["installation"]
body:
  - type: markdown
    attributes:
      value: Thanks for testing the install. Please do not paste API keys, tokens, personal paths, email addresses, or private project data.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Installed and first intake worked
        - Installed but first intake failed
        - Installer did not finish
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: docker
    attributes:
      label: Docker Desktop version
  - type: input
    id: model
    attributes:
      label: Ollama model used
  - type: textarea
    id: step
    attributes:
      label: Where did you get stuck or confused?
      description: Include the exact error text after removing secrets/private data.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What did you expect to happen?
