name: Feature request
description: Propose a concrete improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What real problem does this solve?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What do you do today?
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: What would prove it works?
