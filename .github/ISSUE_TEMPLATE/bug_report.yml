name: Bug report
description: Report a reproducible Arc Brain failure
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove tokens, email addresses, customer/prospect data and other private information before posting."
  - type: input
    id: version
    attributes:
      label: Arc Brain version
      placeholder: v0.1.0-alpha
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Docker Desktop version, n8n version, Ollama version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / sanitized logs
    validations:
      required: true
